# Alternate reverse proxy. The live site https://claw.archim.top uses Apache
# (deploy/apache/claw.archim.top.conf), not this file.
#
# nginx serves the built SPA (apps/web/dist) and reverse-proxies the runtime API
# to the self-hosted Node backend (apps/server). Point the upstream at the PORT
# in server.env. The production host uses 127.0.0.1:8788. Because the SPA and
# the API share one origin, no CORS is involved.
#
# Install:
#   sudo cp deploy/nginx/immortalclaw.conf /etc/nginx/sites-available/immortalclaw.conf
#   sudo ln -s /etc/nginx/sites-available/immortalclaw.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d claw.example.com      # adds TLS (edits this file in place)

server {
    listen 80;
    listen [::]:80;
    server_name claw.example.com;          # <-- change to your domain

    root /var/www/immortalclaw;            # <-- where you copy apps/web/dist
    index index.html;

    # Runtime API → self-hosted backend. Paths mirror apps/web/public/_routes.json
    # (/health, /agent/*, /cultivator/*, /world/*) plus the agent markdown endpoints.
    location ~ ^/(health$|agent/|cultivator/|world/|skill\.md$|register\.md$|heartbeat\.md$) {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes
    # (/dashboard, /agents, /world, /sects, /stat/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
