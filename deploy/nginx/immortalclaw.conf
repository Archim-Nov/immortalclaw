# immortal-claw — single-origin VPS hosting.
# nginx serves the built SPA (apps/web/dist) and reverse-proxies the runtime API
# to the self-hosted Node backend (apps/server) on 127.0.0.1:8787. Because the
# SPA and the API share one origin, no CORS is involved.
#
# Install:
#   sudo cp deploy/nginx/immortalclaw.conf /etc/nginx/sites-available/immortalclaw.conf
#   sudo ln -s /etc/nginx/sites-available/immortalclaw.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d claw.example.com      # adds TLS (edits this file in place)

server {
    listen 80;
    listen [::]:80;
    server_name claw.example.com;          # <-- change to your domain

    root /var/www/immortalclaw;            # <-- where you copy apps/web/dist
    index index.html;

    # Runtime API → self-hosted backend. Paths mirror apps/web/public/_routes.json
    # (/health, /agent/*, /cultivator/*, /world/*) plus the agent markdown endpoints.
    location ~ ^/(health$|agent/|cultivator/|world/|skill\.md$|register\.md$|heartbeat\.md$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Withdrawn owner pages. A leftover file on disk must not come back as 200,
    # and a missing template must not fall through to the SPA shell.
    location = /agent-templates/dungeon-wake { return 404; }
    location = /agent-templates/dungeon-wake.html { return 404; }
    location = /agent-templates/progress-summary { return 404; }
    location = /agent-templates/progress-summary.html { return 404; }
    location = /agent-templates/gift-notice { return 404; }
    location = /agent-templates/gift-notice.html { return 404; }

    location /agent-templates/ {
        try_files $uri =404;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes
    # (/dashboard, /agents, /world, /sects, /stat/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
