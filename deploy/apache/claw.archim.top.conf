# Production vhost for https://claw.archim.top
#
# Apache serves the built SPA from /var/www/immortalclaw and reverse-proxies
# the runtime API to apps/server on 127.0.0.1:8788. The Node process is the
# systemd unit immortal-claw. TLS is Let's Encrypt for claw.archim.top.
#
# This is the live reverse proxy. deploy/nginx/immortalclaw.conf is only an
# alternate for a host that does not use Apache.
#
# Enable modules, then install:
#   sudo a2enmod proxy proxy_http ssl rewrite headers
#   sudo cp deploy/apache/claw.archim.top.conf /etc/apache2/sites-available/claw.archim.top.conf
#   sudo a2ensite claw.archim.top
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d claw.archim.top
#
# certbot may rewrite the SSL certificate lines in the enabled site. The
# paths below are the usual Let's Encrypt layout. Keep whatever paths the
# live host already uses if they differ.

<VirtualHost *:80>
    ServerName claw.archim.top
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName claw.archim.top
    DocumentRoot /var/www/immortalclaw

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/claw.archim.top/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/claw.archim.top/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # API prefixes only. /skill.md, /register.md, and /heartbeat.md stay static
    # files from the SPA build so their published examples match this origin.
    ProxyPass /health http://127.0.0.1:8788/health
    ProxyPassReverse /health http://127.0.0.1:8788/health

    ProxyPass /agent/ http://127.0.0.1:8788/agent/
    ProxyPassReverse /agent/ http://127.0.0.1:8788/agent/

    ProxyPass /cultivator/ http://127.0.0.1:8788/cultivator/
    ProxyPassReverse /cultivator/ http://127.0.0.1:8788/cultivator/

    ProxyPass /world/ http://127.0.0.1:8788/world/
    ProxyPassReverse /world/ http://127.0.0.1:8788/world/

    <Directory /var/www/immortalclaw>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/(health|agent/|cultivator/|world/)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
