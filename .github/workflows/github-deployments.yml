name: GitHub Deployments

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - master

permissions:
  checks: read
  contents: read
  deployments: write

jobs:
  resolve-cloudflare:
    name: Resolve Cloudflare Pages Result
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      details_url: ${{ steps.resolve.outputs.details_url }}
      preview_url: ${{ steps.resolve.outputs.preview_url }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Wait for Cloudflare Pages check run
        id: resolve
        run: node ./scripts/github-deployments/resolve-cloudflare.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  record-preview-deployment:
    name: Record Preview Deployment
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: resolve-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Record Preview deployment for the pull request head SHA
        run: node ./scripts/github-deployments/record-deployment.mjs
        env:
          DEPLOYMENT_DESCRIPTION: Cloudflare Pages preview for PR #${{ github.event.pull_request.number }}
          DEPLOYMENT_ENVIRONMENT: "Preview"
          ENVIRONMENT_URL: ${{ needs.resolve-cloudflare.outputs.preview_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_URL: ${{ needs.resolve-cloudflare.outputs.details_url }}
          PRODUCTION_ENVIRONMENT: "false"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ needs.resolve-cloudflare.outputs.target_sha }}
          TRANSIENT_ENVIRONMENT: "true"

  deactivate-preview-deployments:
    name: Deactivate Preview Deployments
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Mark Preview deployments inactive for the closed pull request
        run: node ./scripts/github-deployments/deactivate-preview-deployments.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  record-production-deployment:
    name: Record Production Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: resolve-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate production deployment URL
        env:
          CLOUDFLARE_PAGES_PRODUCTION_URL: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_URL }}
        run: |
          if [ -z "${CLOUDFLARE_PAGES_PRODUCTION_URL}" ]; then
            echo "CLOUDFLARE_PAGES_PRODUCTION_URL is required to record Production deployments." >&2
            exit 1
          fi
      - name: Record Production deployment for the pushed SHA
        run: node ./scripts/github-deployments/record-deployment.mjs
        env:
          DEPLOYMENT_DESCRIPTION: Cloudflare Pages production deployment
          DEPLOYMENT_ENVIRONMENT: "Production"
          ENVIRONMENT_URL: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_URL: ${{ needs.resolve-cloudflare.outputs.details_url }}
          PRODUCTION_ENVIRONMENT: "true"
          TARGET_SHA: ${{ needs.resolve-cloudflare.outputs.target_sha }}
          TRANSIENT_ENVIRONMENT: "false"
